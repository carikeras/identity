<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2386c8">
  <title>Daftar — CariKeras</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/carikeras/ui@latest/dist/carikeras.min.css">

  <style>
    body { min-height: 100vh; background: #f2f7fb; }
    .register-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
    .register-card {
      width: min(100%, 560px);
      background: #fff;
      border: 1px solid #dbe8f1;
      border-radius: 1.25rem;
      box-shadow: 0 1.25rem 3rem rgba(30,77,107,.12);
      padding: clamp(1.4rem, 4vw, 2.5rem);
    }
    .register-card img { width: 170px; }
    .register-card h1 { font-weight: 900; letter-spacing: -.04em; color: #20354d; }
    .register-card p { color: #66798d; line-height: 1.7; }
  </style>
</head>
<body>
  <main class="register-wrap">
    <section class="register-card">
      <a href="https://cari.cc.cd/" class="d-inline-block mb-5" aria-label="CariKeras">
        <img src="https://cdn.jsdelivr.net/gh/carikeras/assets@latest/brand/carikeras-wordmark.svg" alt="CariKeras">
      </a>

      <div class="small text-primary fw-bold text-uppercase">CariKeras Identity</div>
      <h1 class="mt-2 mb-2">Buat akunmu.</h1>
      <p class="mb-4">Satu akun untuk layanan belajar, project, community, dan profile CariKeras.</p>

      <div id="status" class="alert alert-warning d-none" role="status" aria-live="polite"></div>

      <form id="registerForm" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="name">Nama</label>
            <input class="form-control ck-form-control" id="name" name="name" autocomplete="name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="username">Username</label>
            <input class="form-control ck-form-control" id="username" name="username" autocomplete="username" required>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold" for="email">Email</label>
            <input class="form-control ck-form-control" id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="password">Password</label>
            <input class="form-control ck-form-control" id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold" for="passwordConfirm">Ulangi password</label>
            <input class="form-control ck-form-control" id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="8">
          </div>
        </div>

        <div class="form-check mt-4 mb-4">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label" for="terms">
            Saya setuju dengan ketentuan penggunaan CariKeras.
          </label>
        </div>

        <button class="btn ck-btn ck-btn-primary w-100" type="submit" id="registerButton">Buat akun</button>
      </form>

      <p class="text-center mt-4 mb-0">
        Sudah punya akun?
        <a href="/" class="fw-semibold text-decoration-none">Masuk</a>
      </p>
    </section>
  </main>

  <script>
    (() => {
      const form = document.querySelector("#registerForm");
      const status = document.querySelector("#status");
      const button = document.querySelector("#registerButton");

      form?.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!form.checkValidity()) {
          form.classList.add("was-validated");
          return;
        }

        const data = Object.fromEntries(new FormData(form).entries());

        if (data.password !== data.passwordConfirm) {
          status.textContent = "Password belum sama.";
          status.classList.remove("d-none");
          return;
        }

        button.disabled = true;
        button.textContent = "Memproses…";

        try {
          const response = await fetch("/api/register", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              name: data.name,
              username: data.username,
              email: data.email,
              password: data.password
            })
          });

          if (!response.ok) throw new Error("register_unavailable");

          window.location.href = "/?registered=1";
        } catch {
          status.textContent = "Pendaftaran belum tersedia sampai Identity API terhubung.";
          status.classList.remove("d-none");
        } finally {
          button.disabled = false;
          button.textContent = "Buat akun";
        }
      });
    })();
  </script>
</body>
</html>
